
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090914">
<title>My AI Friend</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #090914;
  --panel: #111120;
  --surface: #1b1b30;
  --purple: #8658ff;
  --text: #f7f5ff;
  --muted: #9996b1;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  min-height: 100dvh;
  display: flex;
  justify-content: center;
}

.app {
  width: 100%;
  max-width: 760px;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse at top, #21143c 0%, transparent 45%),
    var(--bg);
}

/* HEADER */

header {
  display: flex;
  align-items: center;
  padding: 15px;
  gap: 12px;
  border-bottom: 1px solid #ffffff12;
  background: #0d0c19eF;
}

.logo {
  height: 45px;
  width: 45px;
  border-radius: 15px;
  background: linear-gradient(135deg,#a16aff,#5235d9);
  display: grid;
  place-items: center;
  font-size: 25px;
  box-shadow: 0 0 25px #8658ff55;
}

.brand h2 {
  font-size: 17px;
  letter-spacing: .3px;
}

.brand p {
  color: #79e6ad;
  font-size: 11px;
  margin-top: 5px;
}

.header-buttons {
  margin-left: auto;
  display: flex;
  gap: 7px;
}

.header-btn {
  background: var(--surface);
  border: 1px solid #ffffff12;
  padding: 9px 11px;
  border-radius: 10px;
  color: white;
  font-size: 12px;
}

/* CHAT */

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 18px 14px;
  scroll-behavior: smooth;
}

.welcome {
  min-height: 70%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px 10px;
}

.orb {
  width: 105px;
  height: 105px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 46px;
  background: radial-gradient(circle at 35% 30%,
    #c6a5ff,#7944e8 55%,#211044);
  box-shadow: 0 0 35px #8658ff80,
              inset 0 0 20px #ffffff50;
  animation: floating 3s ease-in-out infinite;
}

@keyframes floating {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.welcome h1 {
  margin-top: 28px;
  font-size: 25px;
  background: linear-gradient(90deg,#fff,#c6a6ff);
  -webkit-background-clip: text;
  color: transparent;
}

.welcome p {
  max-width: 340px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
  margin-top: 12px;
}

.suggestions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 25px;
}

.suggestions button {
  background: #211a39;
  border: 1px solid #7048b866;
  color: #d9c9ff;
  padding: 10px 13px;
  border-radius: 20px;
  font-size: 12px;
}

/* MESSAGES */

.message {
  width: fit-content;
  max-width: 88%;
  padding: 13px 15px;
  margin: 15px 0;
  border-radius: 17px;
  line-height: 1.7;
  font-size: 14px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  animation: appear .25s ease;
}

@keyframes appear {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.user {
  margin-left: auto;
  background: linear-gradient(135deg,#754be0,#5432ae);
  border-bottom-right-radius: 4px;
}

.ai {
  margin-right: auto;
  background: #1c1b30;
  border: 1px solid #ffffff12;
  border-bottom-left-radius: 4px;
}

.ai-label {
  display: block;
  color: #c19aff;
  font-size: 11px;
  margin-bottom: 6px;
}

.message-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.message-actions button {
  color: #bca6ff;
  background: #ffffff0b;
  border: 1px solid #ffffff15;
  padding: 5px 10px;
  border-radius: 8px;
  font-size: 11px;
}

.sources {
  margin-top: 12px;
  padding-top: 8px;
  border-top: 1px solid #ffffff18;
}

.sources a {
  display: block;
  color: #8dcaff;
  font-size: 12px;
  margin-top: 7px;
  overflow-wrap: anywhere;
}

.typing {
  padding: 12px;
  color: #b99bff;
  font-size: 13px;
}

/* INPUT */

.bottom {
  padding: 12px;
  background: #11101f;
  border-top: 1px solid #ffffff15;
}

.tools {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--muted);
}

.toggle input {
  accent-color: var(--purple);
}

.input-box {
  display: flex;
  align-items: center;
  gap: 7px;
  background: #201f34;
  border: 1px solid #ffffff20;
  border-radius: 18px;
  padding: 7px;
}

#message {
  min-width: 0;
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 14px;
  padding: 12px 7px;
}

#message::placeholder {
  color: #89869f;
}

.action {
  height: 43px;
  width: 43px;
  flex-shrink: 0;
  border-radius: 13px;
  background: #35314c;
  color: white;
  font-size: 18px;
  border: none;
  cursor: pointer;
}

.action.send {
  background: linear-gradient(135deg,#a16aff,#6237d9);
}

.action:disabled {
  opacity: .5;
}

.status {
  color: var(--muted);
  text-align: center;
  font-size: 10px;
  margin-top: 10px;
}

@media(min-width:600px) {
  #chat { padding: 24px; }
  .bottom { padding: 16px 22px; }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">✦</div>

  <div class="brand">
    <h2>My AI Friend</h2>
    <p>● Your personal AI companion</p>
  </div>

  <div class="header-buttons">
    <button class="header-btn" onclick="stopVoice()">◼</button>
    <button class="header-btn" onclick="clearChat()">New</button>
  </div>
</header>

<main id="chat">

  <section class="welcome" id="welcome">

    <div class="orb">✦</div>

    <h1>Hey! I'm your AI Friend</h1>

    <p>
      তোমার সঙ্গে কথা বলার জন্য আমি এখানে আছি।
      মনের কথা বলো, প্রশ্ন করো অথবা গল্প করো।
      চলো, আজ থেকেই আমাদের কথোপকথন শুরু হোক।
    </p>

    <div class="suggestions">
      <button onclick="suggest('হ্যালো! কেমন আছো?')">
        হ্যালো!
      </button>

      <button onclick="suggest('আজ আমার মন ভালো নেই।')">
        মন খারাপ
      </button>

      <button onclick="suggest('আমাকে একটা সুন্দর গল্প বলো।')">
        একটা গল্প বলো
      </button>
    </div>

  </section>

</main>

<footer class="bottom">

  <div class="tools">

    <label class="toggle">
      <input type="checkbox" id="search">
      Google Search
    </label>

    <label class="toggle">
      <input type="checkbox" id="autoVoice">
      Auto Voice Reply
    </label>

  </div>

  <div class="input-box">

    <button class="action" id="mic"
      onclick="startVoice()">🎙</button>

    <input
      id="message"
      type="text"
      placeholder="আমার সঙ্গে কথা বলো..."
      autocomplete="off"
    >

    <button class="action send" id="send"
      onclick="sendMessage()">➤</button>

  </div>

  <div class="status" id="status">
    Powered by Gemini AI
  </div>

</footer>

</div>

<script>

// YOUR CLOUDFLARE WORKER URL
const API_URL =
"https://my-ai-friend-api.echoversestudio0.workers.dev";

// ELEMENTS
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendBtn = document.getElementById("send");
const statusText = document.getElementById("status");

// LOCAL MEMORY
const STORAGE_KEY = "my_ai_friend_history_v1";

let history = [];

try {
  const saved = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
  );

  if (Array.isArray(saved)) {
    history = saved.filter(m =>
      (m.role === "user" || m.role === "model") &&
      typeof m.text === "string"
    ).slice(-40);
  }
} catch {
  history = [];
}

function saveHistory() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(history.slice(-40))
    );
  } catch {
    statusText.textContent = "Memory storage unavailable";
  }
}

// ADD MESSAGE
function addMessage(text, type, sources = []) {

  document.getElementById("welcome")?.remove();

  const div = document.createElement("div");
  div.className = "message " + type;

  if (type === "ai") {

    const label = document.createElement("small");
    label.className = "ai-label";
    label.textContent = "✦ MY AI FRIEND";

    div.appendChild(label);
  }

  const content = document.createElement("div");
  content.textContent = text;
  div.appendChild(content);

  if (type === "ai") {

    const actions = document.createElement("div");
    actions.className = "message-actions";

    const speakButton = document.createElement("button");
    speakButton.textContent = "🔊 Listen";
    speakButton.onclick = () => speak(text);

    const copyButton = document.createElement("button");
    copyButton.textContent = "Copy";
    copyButton.onclick = async () => {
      try {
        await navigator.clipboard.writeText(text);
        copyButton.textContent = "Copied!";
      } catch {
        copyButton.textContent = "Copy failed";
      }
    };

    actions.append(speakButton, copyButton);
    div.appendChild(actions);
  }

  if (sources.length) {

    const sourceBox = document.createElement("div");
    sourceBox.className = "sources";

    sources.forEach(source => {

      const url = source.web?.uri;
      const title = source.web?.title;

      if (!url || !/^https?:\/\//i.test(url)) return;

      const link = document.createElement("a");
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "↗ " + (title || "Source");

      sourceBox.appendChild(link);
    });

    div.appendChild(sourceBox);
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  return div;
}

// SUGGESTION
function suggest(text) {
  input.value = text;
  sendMessage();
}

// CLEAR CHAT
function clearChat() {

  if (!confirm("তুমি কি পুরোনো কথোপকথন মুছে ফেলতে চাও?")) {
    return;
  }

  history = [];
  saveHistory();
  stopVoice();

  chat.innerHTML = `
    <section class="welcome" id="welcome">
      <div class="orb">✦</div>
      <h1>Hey! I'm your AI Friend</h1>
      <p>চলো, আবার নতুন করে কথা শুরু করি।</p>
    </section>
  `;

  statusText.textContent = "New conversation started";
}

// SEND MESSAGE
async function sendMessage() {

  const text = input.value.trim();

  if (!text || sendBtn.disabled) return;

  stopVoice();

  history.push({
    role: "user",
    text: text
  });

  addMessage(text, "user");

  input.value = "";
  sendBtn.disabled = true;

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.textContent = "✦ ভাবছি...";

  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  statusText.textContent = "AI is thinking...";

  try {

    const response = await fetch(API_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({

        messages: history.slice(-20),

        useSearch:
          document.getElementById("search").checked

      })

    });

    let data;

    try {
      data = await response.json();
    } catch {
      throw new Error("Server থেকে সঠিক উত্তর পাওয়া যায়নি।");
    }

    if (!response.ok) {
      throw new Error(
        data.error || "Gemini API Error: " + response.status
      );
    }

    const answer = data.answer;

    if (!answer) {
      throw new Error("AI কোনো উত্তর দেয়নি।");
    }

    history.push({
      role: "model",
      text: answer
    });

    saveHistory();

    typing.remove();

    addMessage(
      answer,
      "ai",
      Array.isArray(data.sources) ? data.sources : []
    );

    statusText.textContent = "● Connected to Gemini AI";

    if (document.getElementById("autoVoice").checked) {
      speak(answer);
    }

  } catch(error) {

    typing.remove();

    history.pop();

    saveHistory();

    addMessage(
      "দুঃখিত! একটা সমস্যা হয়েছে।\n" + error.message,
      "ai"
    );

    statusText.textContent = "Connection error";

  } finally {

    sendBtn.disabled = false;
    input.focus();

  }
}

// ENTER TO SEND
input.addEventListener("keydown", function(e) {

  if (e.key === "Enter") {
    e.preventDefault();
    sendMessage();
  }

});

// VOICE INPUT
let recognition = null;
let isListening = false;

function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("এই Browser Voice Input Support করছে না। Chrome ব্যবহার করো।");
    return;
  }

  if (isListening) {
    recognition?.stop();
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "bn-IN";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onstart = () => {

    isListening = true;
    document.getElementById("mic").textContent = "🔴";
    statusText.textContent = "শুনছি...";

  };

  recognition.onresult = (event) => {

    const result = event.results[0][0].transcript;

    input.value = result;
    sendMessage();

  };

  recognition.onerror = (event) => {

    statusText.textContent = "Voice error: " + event.error;

  };

  recognition.onend = () => {

    isListening = false;
    document.getElementById("mic").textContent = "🎙";

    if (!sendBtn.disabled) {
      statusText.textContent = "Powered by Gemini AI";
    }

  };

  try {
    recognition.start();
  } catch(error) {
    statusText.textContent = "Microphone could not start";
  }

}

// VOICE OUTPUT
function speak(text) {

  if (!("speechSynthesis" in window)) {
    alert("Voice output support পাওয়া যায়নি।");
    return;
  }

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.lang = "bn-IN";
  utterance.rate = 1;
  utterance.pitch = 1;

  speechSynthesis.speak(utterance);

}

// STOP VOICE
function stopVoice() {

  if (recognition && isListening) {
    recognition.stop();
  }

  if ("speechSynthesis" in window) {
    speechSynthesis.cancel();
  }

}

// RESTORE HISTORY
function restoreHistory() {

  if (history.length === 0) return;

  document.getElementById("welcome")?.remove();

  history.forEach(item => {

    addMessage(
      item.text,
      item.role === "user" ? "user" : "ai"
    );

  });

}

restoreHistory();

</script>

</body>
  </html>
